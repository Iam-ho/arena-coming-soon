<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>آرنا نیک تجهیز آزما | به زودی</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Tahoma, 'Segoe UI', sans-serif; }
        body {
            /* تصویر پس‌زمینه ظروف آزمایشگاهی با لایه تاریک‌کننده برای خوانایی بهتر */
            background: linear-gradient(rgba(15, 32, 39, 0.85), rgba(32, 58, 67, 0.85)), 
                        url('https://images.unsplash.com/photo-1532187863486-abf9dbad1b69?q=80&w=1920&auto=format&fit=crop') no-repeat center center fixed;
            background-size: cover;
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }
        .container {
            max-width: 650px;
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(12px);
            padding: 40px 30px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }
        .logo-title { font-size: 2.2rem; margin-bottom: 8px; color: #00d2d3; font-weight: bold; }
        .subtitle { font-size: 1.1rem; color: #c8d6e5; margin-bottom: 25px; }
        p { font-size: 0.950rem; color: #a4b0be; margin-bottom: 30px; line-height: 1.8; }
        
        .timer-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            direction: ltr;
            margin-bottom: 35px;
        }
        .time-box {
            background: rgba(0, 0, 0, 0.5);
            padding: 15px 20px;
            border-radius: 10px;
            min-width: 80px;
            border-bottom: 3px solid #00d2d3;
        }
        .time-box span { display: block; font-size: 2rem; font-weight: bold; color: #fff; }
        .time-box label { font-size: 0.8rem; color: #8395a7; }

        .contact-box {
            border-top: 1px solid rgba(255, 255, 255, 0.15);
            padding-top: 25px;
            text-align: right;
        }
        .contact-box h3 { font-size: 1.1rem; color: #00d2d3; margin-bottom: 12px; }
        .contact-item {
            font-size: 0.95rem;
            color: #dfe4ea;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .contact-item a { color: #00d2d3; text-decoration: none; }
        .contact-item a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo-title">آرنا نیک تجهیز آزما</div>
        <div class="subtitle">تامین‌کننده مواد شیمیایی و تجهیزات آزمایشگاهی</div>
        <p>وب‌سایت تخصصی ما به زودی با قابلیت‌های جدید راه‌اندازی خواهد شد.</p>
        
        <!-- شمارش معکوس ۱۵ روزه -->
        <div class="timer-container">
            <div class="time-box"><span id="days">00</span><label>روز</label></div>
            <div class="time-box"><span id="hours">00</span><label>ساعت</label></div>
            <div class="time-box"><span id="minutes">00</span><label>دقیقه</label></div>
            <div class="time-box"><span id="seconds">00</span><label>ثانیه</label></div>
        </div>

        <!-- اطلاعات تماس مدیر فروش -->
        <div class="contact-box">
            <h3>ارتباط با بخش فروش و بازرگانی:</h3>
            <div class="contact-item">
                <span>مسئول:</span> <strong>امیرحسین زارعی</strong> (مدیر فروش و بازرگانی)
            </div>
            <div class="contact-item" style="direction: ltr; justify-content: flex-end;">
                <span>تلفن تماس:</span> <a href="tel:+989192923583">+98 919 292 3583</a>
            </div>
            <div class="contact-item">
                <span>ایمیل:</span> <a href="mailto:ah.zarei@arenanik.ir">ah.zarei@arenanik.ir</a>
            </div>
        </div>
    </div>

    <script>
        // تنظیم تایمر روی ۱۵ روز آینده
        const targetDate = new Date();
        targetDate.setDate(targetDate.getDate() + 15);

        function updateTimer() {
            const now = new Date().getTime();
            const distance = targetDate - now;

            if (distance < 0) {
                document.querySelector('.timer-container').innerHTML = "<h3>سایت به‌زودی در دسترس قرار می‌گیرد...</h3>";
                return;
            }

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            document.getElementById("days").innerText = days.toString().padStart(2, '0');
            document.getElementById("hours").innerText = hours.toString().padStart(2, '0');
            document.getElementById("minutes").innerText = minutes.toString().padStart(2, '0');
            document.getElementById("seconds").innerText = seconds.toString().padStart(2, '0');
        }

        setInterval(updateTimer, 1000);
        updateTimer();
    </script>
</body>
</html>
